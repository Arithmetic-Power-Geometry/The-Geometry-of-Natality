name: GoN exact orbit-key gate
on:
  push:
    branches:
      - research/gon-stage1-20261019
    paths:
      - 'experiments/research_gate/exact_orbit_key.py'
      - 'tests/test_exact_orbit_key.py'
      - '.github/workflows/gon-exact-orbit-key.yml'
  workflow_dispatch:
jobs:
  exact-orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record environment and syntax
        run: |
          python --version
          git rev-parse HEAD
          python -m py_compile experiments/research_gate/exact_orbit_key.py tests/test_exact_orbit_key.py
      - name: Exhaustive orbit equivalence tests
        run: python -m unittest discover -s tests -p test_exact_orbit_key.py -v
