name: GoN Prompt 15 authoritative full manuscript
on:
  push:
    branches: [research/gon-stage1-20261019]
    paths:
      - 'paper/gon_prompt15_authoritative.tex'
      - 'paper/original_20261019_recovered.tex'
      - 'paper/gon_prompt15_references.bib'
      - '.github/workflows/gon-prompt15-authoritative.yml'
  workflow_dispatch:
jobs:
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install full manuscript toolchain
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-science texlive-bibtex-extra biber lmodern poppler-utils
      - name: Source completeness and reference key integrity
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('paper/original_20261019_recovered.tex').read_text()
          m=pathlib.Path('paper/gon_prompt15_authoritative.tex').read_text()
          b=pathlib.Path('paper/gon_prompt15_references.bib').read_text()
          assert [s.count('\\begin{'+x+'}') for x in ('proposition','algorithm','figure','table')]==[6,4,4,8]
          keys=set(re.findall(r'@\w+\s*\{\s*([^,]+)',b))
          used=set(k.strip() for group in re.findall(r'\\(?:cite|parencite|textcite|autocite)\{([^}]*)\}',m) for k in group.split(','))
          assert len(keys)==23 and not (used-keys),('missing',used-keys)
          assert m.count('\\begin{proposition}')==6
          print('verified 6 propositions, 4 algorithms, 4 figures, 8 tables, 23 bib keys')
          PY
      - name: Compile exact committed manuscript from paper directory
        run: |
          cd paper
          pdflatex -halt-on-error -interaction=nonstopmode gon_prompt15_authoritative.tex
          biber gon_prompt15_authoritative
          pdflatex -halt-on-error -interaction=nonstopmode gon_prompt15_authoritative.tex
          pdflatex -halt-on-error -interaction=nonstopmode gon_prompt15_authoritative.tex
          mkdir -p ../build
          cp gon_prompt15_authoritative.pdf gon_prompt15_authoritative.log gon_prompt15_authoritative.blg ../build/
          cd ..
          pdfinfo build/gon_prompt15_authoritative.pdf | grep Pages
          pdftotext build/gon_prompt15_authoritative.pdf - | grep -F 'Conclusion'
          ! grep -Eq 'LaTeX Warning: There were undefined references|Citation.*undefined' build/gon_prompt15_authoritative.log
      - name: Render all pages for visual review
        run: |
          mkdir -p build/pages
          pdftoppm -f 1 -l 30 -r 90 -png build/gon_prompt15_authoritative.pdf build/pages/page >/dev/null 2>&1
          test "$(find build/pages -name '*.png' | wc -l)" -ge 14
      - uses: actions/upload-artifact@v4
        with:
          name: gon-prompt15-authoritative-pdf-and-renders
          path: |
            build/gon_prompt15_authoritative.pdf
            build/gon_prompt15_authoritative.log
            build/gon_prompt15_authoritative.blg
            build/pages/*.png
