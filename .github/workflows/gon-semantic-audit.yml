name: GoN adversarial semantic audit
on:
  push:
    branches:
      - research/gon-stage1-20261019
    paths:
      - 'experiments/research_gate/semantic_audit.py'
      - 'tests/test_semantic_audit.py'
      - '.github/workflows/gon-semantic-audit.yml'
  workflow_dispatch:
jobs:
  exhaustive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile experiments/research_gate/semantic_audit.py tests/test_semantic_audit.py
      - name: Independent exhaustive semantic tests
        run: python -m unittest discover -s tests -p test_semantic_audit.py -v
      - name: Generate audit evidence
        run: python -m experiments.research_gate.semantic_audit > experiments/research_gate/prompt4_semantic_evidence.json
      - name: Upload machine-readable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gon-prompt4-semantic-evidence
          path: experiments/research_gate/prompt4_semantic_evidence.json
          if-no-files-found: warn
