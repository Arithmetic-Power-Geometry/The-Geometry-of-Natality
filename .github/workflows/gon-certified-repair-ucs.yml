name: GoN certified repair UCS gate
on:
  push:
    branches:
      - research/gon-stage1-20261019
    paths:
      - 'experiments/research_gate/certified_repair_ucs.py'
      - 'tests/test_certified_repair_ucs.py'
      - '.github/workflows/gon-certified-repair-ucs.yml'
  workflow_dispatch:
jobs:
  replay-and-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile sources
        run: python -m py_compile experiments/research_gate/certified_repair_ucs.py tests/test_certified_repair_ucs.py
      - name: Run exact planner oracle and adversarial tests
        run: python -m unittest discover -s tests -p test_certified_repair_ucs.py -v
      - name: Run representative matched examples
        run: python -m experiments.research_gate.certified_repair_ucs
